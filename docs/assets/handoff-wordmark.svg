<!--
  handoff 项目的主文字标志。

  职责：
    - 以可缩放的矢量文字呈现 handoff 品牌名
    - 通过 d 与 o 之间的断点表达任务从审核者交接给执行者

  边界：
    - 不包含独立图标、标语或背景色
    - 不承担深色背景版本与单色印刷版本
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="260"
  viewBox="0 0 760 260"
  role="img"
  aria-labelledby="handoff-logo-title handoff-logo-description"
>
  <title id="handoff-logo-title">handoff</title>
  <desc id="handoff-logo-description">
    handoff 文字标志，d 与 o 之间的短断点表示任务交接。
  </desc>

  <!--
    使用常见圆体到无衬线体的降级链，并为最宽的回退字形预留画布空间。
    字形仍由本机字体渲染，因此品牌字重可随项目最终选定的开源字体继续替换。
  -->
  <text
    x="50"
    y="190"
    fill="#111827"
    font-family="Avenir Next Rounded, Avenir Next, Nunito Sans, Inter, sans-serif"
    font-size="150"
    font-weight="700"
    letter-spacing="-5"
  >hand</text>

  <!-- 断点保留真实留白，避免连接线被误读成箭头或独立符号。 -->
  <rect x="380" y="137" width="43" height="12" rx="6" fill="#111827" />
  <rect x="433" y="137" width="43" height="12" rx="6" fill="#4F46E5" />

  <text
    x="474"
    y="190"
    fill="#4F46E5"
    font-family="Avenir Next Rounded, Avenir Next, Nunito Sans, Inter, sans-serif"
    font-size="150"
    font-weight="700"
    letter-spacing="-5"
  >off</text>
</svg>
