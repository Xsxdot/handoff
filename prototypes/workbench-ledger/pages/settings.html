<!doctype html>
<!--
  设置页（/settings）—— 镜像 SettingsPage.tsx：三栏外壳不变，中央换成
  左侧分区导航（开发机/常规/Env 文件）+ 右侧内容的整页设置。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>handoff 控制台 · 设置</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .settings { display: flex; height: 100%; }
  .settings nav { width: 180px; border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  .settings nav a { padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--foreground); text-decoration: none; }
  .settings nav a.active { background: var(--muted); font-weight: 500; }
  .settings .body { flex: 1; padding: 20px; overflow-y: auto; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">handoff</div>
    <div class="tree">
      <div class="tree-group">
        <div class="tree-label">本机</div>
        <a class="tree-item">handoff</a>
        <a class="tree-item">└ 7a8334f4（工作树）</a>
      </div>
      <div class="tree-group">
        <div class="tree-label">mac-02</div>
        <a class="tree-item">gokit</a>
      </div>
    </div>
    <div class="footer">
      <a href="board.html">工作项 <span class="badge">3</span></a>
      <a href="../index.html">看板</a>
      <a>工单 <span class="badge">2</span></a>
      <a class="active" aria-current="page" style="background:var(--muted)">设置</a>
      <a>＋ 添加项目</a>
    </div>
  </aside>

  <div class="main">
    <main class="content">
      <div class="settings">
        <nav>
          <a class="active" data-tab="machines">开发机</a>
          <a data-tab="general">常规</a>
          <a data-tab="env">Env 文件</a>
        </nav>
        <div class="body">
          <div class="panel-sec" data-panel="machines">
            <h2 style="margin:0 0 12px;font-size:16px">开发机</h2>
            <div class="card" style="padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
              <span class="badge solid">在线</span><strong style="font-size:13px">本机</strong><span class="dim mono" style="font-size:12px">127.0.0.1:7466</span>
            </div>
            <div class="card" style="padding:12px;display:flex;align-items:center;gap:10px">
              <span class="badge solid">在线</span><strong style="font-size:13px">mac-02</strong><span class="dim mono" style="font-size:12px">192.168.1.42:7466</span>
              <button class="btn sm" style="margin-left:auto">编辑</button>
            </div>
          </div>
          <div class="panel-sec" data-panel="general" hidden>
            <h2 style="margin:0 0 12px;font-size:16px">常规</h2>
            <p class="dim" style="font-size:13px">常规配置项（占位）。</p>
          </div>
          <div class="panel-sec" data-panel="env" hidden>
            <h2 style="margin:0 0 12px;font-size:16px">Env 文件</h2>
            <p class="dim" style="font-size:13px">Env 文件管理（占位）。</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  // 设置分区切换
  document.querySelectorAll('.settings nav a').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.settings nav a').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel-sec').forEach(p => p.hidden = true);
      tab.classList.add('active');
      document.querySelector(`.panel-sec[data-panel="${tab.dataset.tab}"]`).hidden = false;
    });
  });
</script>
</body>
</html>
