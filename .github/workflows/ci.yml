# PR 与 push main 上的验证门，同时经 workflow_call 供 release.yml 复用。
#
# 职责：
#   - 在任何代码进 main 之前、以及任何 tag 出资产之前，跑同一套检查
#
# 边界：
#   - 不产出任何资产、不发布任何东西——那是 release.yml 的事
#   - 与 release 的前置校验必须是**同一份定义**：写两份必然漂移，
#     且方向总是 release 那份更松（推 tag 时没人盯着它）
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 构建
        run: go build ./...
      - name: 静态检查
        run: go vet ./...
      - name: 测试
        run: go test ./... -count=1
      - name: 格式
        # gofmt -l 对未格式化的文件只打印文件名、退出码仍是 0，
        # 直接当命令用等于没有这道门，必须自己判空。
        # 用 git ls-files 限定范围：仓库里可能存在嵌套的 .claude/worktrees/，
        # 直接 gofmt -l . 会把它们扫进来误报。
        run: |
          set -euo pipefail
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then
            printf '以下文件未格式化：\n%s\n' "$out" >&2
            exit 1
          fi
      - name: desktop 模块依赖对齐
        # desktop 是嵌套 module，用 replace 指向主模块——主模块新增依赖时它的
        # go.mod/go.sum 不会自己跟上。三个 desktop 构建 job 末尾都有「确认工作区
        # 干净」的门，于是这种漂移只会在**推完 tag 之后**炸（v0.3.2 整条 release
        # 就是这么全红的：主模块的 relay 引入 noise/yamux/x-crypto，desktop 没跟）。
        # 那时版本号已经用掉了。把同一道门提前到 PR 上，代价是一次 go mod tidy。
        run: |
          set -euo pipefail
          cd desktop
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo 'desktop/go.mod 与主模块依赖不同步：在 desktop/ 下跑 go mod tidy 并提交上面的改动' >&2
            exit 1
          fi
      - name: Windows 交叉编译门禁
        # agentd 在 Windows 上跑不起来（B37），但协调者路径必须能编译——
        # 从 B36 起这就是硬约束，B86 之后 Windows 还要真发资产，两个 arch 都要过。
        # B37 起追加 vet：build 只看非测试代码，测试文件里的 unix-ism 同样能把
        # Windows 之路堵死，而那正是 B37 落地后最容易被静默弄坏的地方。
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: install.sh 单测
        run: bash install_test.sh

  # windows：Windows runner 上的运行期验证。install.ps1 的 PowerShell 单测 +
  # Go 侧真正需要 Windows 内核语义的那些包。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 两个版本都要跑，不是冗余：install.ps1 把「兼容 Windows 自带的 PS 5.1」
      # 列为硬要求，而 5.1 与 7 在 Invoke-WebRequest 的响应对象上有实质差异。
      # 只跑 pwsh 等于把这条硬要求写了却不验。
      - name: install.ps1 单测（PowerShell 5.1）
        shell: powershell
        run: .\install_test.ps1
      - name: install.ps1 单测（PowerShell 7）
        shell: pwsh
        run: .\install_test.ps1
      # Go 侧此前在 Windows 上一行测试都没跑过：命名管道中继、匿名管道不 EOF、
      # 管道名抢占防护、AF_UNIX 往返，全是运行期行为，在 Linux/macOS runner 上
      # 写多少单测都碰不到。交叉编译门禁只防编译期回归，防不住运行期语义错配
      # （B128 实证：syscall.O_NONBLOCK 在 Windows 上有定义、编译得过、运行期必炸）。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Windows 运行期单测
        run: go test ./internal/prochost/... ./internal/executor/claudecode/... -count=1
